name: timecampus

services:
  valkey:
    image: valkey/valkey:8-alpine
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ];
      then exec valkey-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
      else exec valkey-server --appendonly yes;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - valkey-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then valkey-cli -a \"$${REDIS_PASSWORD}\" ping; else valkey-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports:
      - "${QDRANT_HTTP_PORT:-127.0.0.1:6333}:6333"
      - "${QDRANT_GRPC_PORT:-127.0.0.1:6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-127.0.0.1:11434}:11434"
    dns:
      - 223.5.5.5
      - 1.1.1.1
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20

  ollama-pull-all-minilm:
    image: ollama/ollama:latest
    dns:
      - 223.5.5.5
      - 1.1.1.1
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_EMBEDDING_MODEL:-all-minilm}"]
    depends_on:
      ollama:
        condition: service_started
    restart: "no"

  cap:
    image: tiago2/cap:latest
    dns:
      - 223.5.5.5
      - 1.1.1.1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      ADMIN_KEY: ${CAP_ADMIN_KEY:?CAP_ADMIN_KEY is required}
      REDIS_URL: ${CAP_REDIS_URL:-redis://valkey:6379}
      SERVER_HOSTNAME: 0.0.0.0
      CORS_ORIGIN: ${CAP_CORS_ORIGIN:-https://admin.timecampus.asia}
      RATELIMIT_IP_HEADER: x-forwarded-for
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped

volumes:
  valkey-data:
  qdrant-data:
  ollama-data:
